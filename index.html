<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة تواصل مشفرة - نموذج</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        video { border: 2px solid #333; margin: 10px; background: #000; width: 40%; }
    </style>
</head>
<body>
    <h2>منصتي الخاصة</h2>
    <p>معرف جهازك: <strong id="myPeerId">جاري التحميل...</strong></p>
    
    <input type="text" id="targetId" placeholder="اكتب ID الطرف الآخر هنا">
    <button onclick="startCall()">اتصال فيديو</button>
    
    <br><br>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer(); // إنشاء الهوية تلقائياً
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');

        // 1. عرض معرفك الخاص
        peer.on('open', (id) => { document.getElementById('myPeerId').innerText = id; });

        // 2. استقبال مكالمة
        peer.on('call', (call) => {
            navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
                localVideo.srcObject = stream;
                call.answer(stream); // الرد على الاتصال
                call.on('stream', remoteStream => { remoteVideo.srcObject = remoteStream; });
            });
        });

        // 3. إجراء مكالمة
        function startCall() {
            const targetId = document.getElementById('targetId').value;
            navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
                localVideo.srcObject = stream;
                const call = peer.call(targetId, stream);
                call.on('stream', remoteStream => { remoteVideo.srcObject = remoteStream; });
            });
        }
    </script>
</body>
</html>
